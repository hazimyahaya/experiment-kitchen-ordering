<style>
:root {

}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark) {
    --bg: #14100b; --card: #211a13; --ink: #f5ede2; --ink-soft: #b5a897;
    --accent: #ff8a52; --accent-2: #ffab73; --accent-ink: #17110a;
    --line: #372c20; --low: #ff6f5e; --low-bg: #3a2019; --ok: #6fce93;
    --chip: #2a2118; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px rgba(0,0,0,0.4);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"] {

  --accent: #ff8a52; --accent-2: #ffab73; --accent-ink: #17110a;
  --line: #372c20; --low: #ff6f5e; --low-bg: #3a2019; --ok: #6fce93;
  --chip: #2a2118; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px rgba(0,0,0,0.4);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased; padding-bottom:48px; letter-spacing:-0.01em; }
.container { max-width:720px; margin:0 auto; padding:18px; }
header.top { position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(10px); padding:16px 18px 12px; border-bottom:1px solid var(--line); }
h1 { font-size:1.15rem; margin:0 0 3px; font-weight:800; letter-spacing:-0.02em; }
.sub { color:var(--ink-soft); font-size:0.83rem; margin:0; line-height:1.4; }
.back-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.back-btn { background:none; border:none; color:var(--accent); font-size:0.92rem; padding:6px 0; cursor:pointer; font-weight:700; transition:opacity .15s; }
.back-btn:active { opacity:0.6; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
.dept-card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow-sm); border:1px solid var(--line); padding:18px 16px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:8px; transition:transform .12s, box-shadow .12s; }
.dept-card:active { transform:scale(0.97); box-shadow:var(--shadow-sm); }
.dept-card .emoji { width:40px; height:40px; border-radius:12px; background:var(--chip); display:flex; align-items:center; justify-content:center; font-size:1.3rem; }
.dept-card .outlet { font-weight:700; font-size:0.94rem; margin-top:2px; }
.dept-card .dept { color:var(--ink-soft); font-size:0.78rem; }
.wide-card { grid-column:1/-1; border-radius:var(--radius); padding:18px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; box-shadow:var(--shadow); border:none; transition:transform .12s; }
.wide-card:active { transform:scale(0.98); }
.summary-card { background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:var(--accent-ink); }
.directory-card { background:var(--chip); color:var(--ink); border:1px solid var(--line); box-shadow:none; }
.wide-card .t { font-weight:800; font-size:1rem; }
.wide-card .s { font-size:0.78rem; opacity:0.85; margin-top:2px; }
.search-wrap { margin-top:14px; }
input[type="text"].search { width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:0.9rem; font-family:var(--font); transition:border-color .15s, box-shadow .15s; }
input[type="text"].search:focus, input[type="date"]:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.pic-row { display:flex; gap:8px; margin-top:12px; }
.pic-row input { flex:1; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:0.85rem; font-family:var(--font); }
input[type="date"] { padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:0.85rem; font-family:var(--font); width:100%; }
.supplier-group { margin-top:18px; }
.supplier-title { font-size:0.74rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); font-weight:700; margin:0 0 8px 2px; display:flex; align-items:center; gap:6px; cursor:pointer; padding:12px; border-radius:14px; user-select:none; background:var(--chip); transition:opacity .15s; }
.supplier-title:active { opacity:0.75; }
.supplier-title .chev { margin-left:auto; font-size:0.7rem; transition:transform 0.18s; color:var(--ink-soft); }
.supplier-title.open .chev { transform:rotate(90deg); }
.supplier-title .count { background:var(--card); border-radius:20px; padding:2px 9px; font-size:0.68rem; box-shadow:var(--shadow-sm); }
.item-card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px; box-shadow:var(--shadow-sm); transition:border-color .15s; }
.item-card.filled { border-color:var(--accent); box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent); }
.item-name { font-weight:700; font-size:0.89rem; letter-spacing:-0.01em; }
.item-name-input { font-weight:700; font-size:0.89rem; letter-spacing:-0.01em; width:100%; border:none; background:none; color:var(--ink); font-family:var(--font); padding:2px 0; border-bottom:1px dashed transparent; }
.item-name-input:focus { outline:none; border-bottom-color:var(--accent); }
.item-meta { color:var(--ink-soft); font-size:0.72rem; margin-top:2px; }
.item-inputs { display:flex; gap:8px; margin-top:10px; }
.field { flex:1; }
.field label { display:block; font-size:0.63rem; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px; font-weight:600; }
.field input { width:100%; padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:0.88rem; font-family:var(--font); transition:border-color .15s; }
.field input:focus { outline:none; border-color:var(--accent); }
.field.status input { font-size:0.8rem; }
.item-card.low .field.current input { border-color:var(--low); background:var(--low-bg); }
.adhoc-box { margin-top:20px; border-top:1px dashed var(--line); padding-top:16px; }
.adhoc-row { display:flex; gap:6px; margin-bottom:8px; }
.adhoc-row input { flex:1; padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:0.82rem; font-family:var(--font); }
.adhoc-row input.name { flex:2; }
.add-adhoc-btn, .del-adhoc-btn { border:1px dashed var(--line); background:none; color:var(--ink-soft); border-radius:10px; padding:9px 12px; font-size:0.8rem; cursor:pointer; font-family:var(--font); }
.del-adhoc-btn { border:none; color:var(--low); font-size:1rem; padding:4px 8px; }
.save-bar { position:sticky; bottom:0; background:linear-gradient(to top, var(--bg) 70%, transparent); padding:18px 0 6px; margin-top:20px; }
.save-btn { width:100%; background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:var(--accent-ink); border:none; padding:16px; border-radius:16px; font-size:0.95rem; font-weight:800; cursor:pointer; box-shadow:0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); font-family:var(--font); transition:transform .1s; }
.save-btn:active { transform:scale(0.98); }
.save-btn:disabled { opacity:0.6; box-shadow:none; }
.status-msg { text-align:center; font-size:0.8rem; margin-top:10px; color:var(--ink-soft); font-weight:500; }
.status-msg.ok { color:var(--ok); }
.status-msg.err { color:var(--low); }
.empty { text-align:center; color:var(--ink-soft); padding:40px 16px; font-size:0.85rem; line-height:1.6; }
.outlet-block { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-top:16px; box-shadow:var(--shadow); }
.outlet-block h2 { margin:0 0 10px; font-size:1.05rem; font-weight:800; }
.sup-title { font-size:0.78rem; font-weight:700; margin:14px 0 6px; display:flex; align-items:center; gap:4px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.4px; }
.item-line { font-size:0.87rem; padding:4px 0; display:flex; gap:6px; line-height:1.4; }
.item-line .bullet { color:var(--accent); font-weight:700; }
.item-line.flag { color:var(--low); }
.copy-btn, .wa-btn { border:1px solid var(--line); background:var(--chip); color:var(--ink); border-radius:12px; padding:9px 14px; font-size:0.78rem; cursor:pointer; margin-top:14px; margin-right:8px; font-weight:600; font-family:var(--font); transition:transform .1s; }
.copy-btn:active, .wa-btn:active { transform:scale(0.96); }
.wa-btn { background:#25d366; color:#04371f; border:none; font-weight:700; text-decoration:none; display:inline-block; }
.dir-outlet-tabs { display:flex; gap:8px; margin-top:12px; overflow-x:auto; padding-bottom:2px; }
.dir-tab { flex:none; padding:9px 16px; border-radius:20px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-size:0.8rem; cursor:pointer; white-space:nowrap; font-weight:600; font-family:var(--font); transition:background .15s; }
.dir-tab.active { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700; }
.dir-row { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:6px; box-shadow:var(--shadow-sm); }
.dir-row .dname { flex:1; font-size:0.83rem; }
.dir-row input { width:130px; padding:8px 10px; border-radius:9px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:0.8rem; font-family:var(--font); }
.item-card input.unresolved { border-color:var(--low); background:var(--low-bg); }
.dir-save-hint { font-size:0.68rem; color:var(--ink-soft); text-align:right; margin-top:-2px; margin-bottom:8px; min-height:14px; font-weight:600; }
.add-dir-box { margin-top:18px; border-top:1px dashed var(--line); padding-top:16px; }
.add-dir-row { display:flex; gap:6px; }
.add-dir-row input { flex:1; padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:0.82rem; font-family:var(--font); }
.add-dir-btn { background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px; padding:9px 16px; font-size:0.8rem; font-weight:700; cursor:pointer; font-family:var(--font); }
.last-updated { font-size:0.72rem; color:var(--ink-soft); margin-top:4px; font-weight:500; }
.banner { background:var(--chip); border-radius:12px; padding:12px 14px; font-size:0.78rem; color:var(--ink-soft); margin-top:12px; line-height:1.5; }
</style>
</head>

function norm(s) {
  s = (s || "").toUpperCase().trim();
  s = s.replace(/\(.*?\)/g, "");
  s = s.replace(/[^A-Z0-9 ]/g, " ");
  s = s.replace(/\s+/g, " ").trim();
  return s;
}
function smartTitle(name) {
  const m = name.match(/^(\d+)([A-Za-z].*)$/);
  // (leading-digit-glued-word fix skipped client-side; data already clean at source)
  let titled = name.replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.substr(1).toLowerCase());
  titled = titled.replace(/[A-Za-z]+/g, w => KEEP_UPPER.has(w.toUpperCase()) ? w.toUpperCase() : w);
  return titled;
}
function cleanQty(raw, fallbackUnit) {
  raw = (raw || "").trim();
  const m = raw.match(/^([\d½¼¾/.,]+)\s*([A-Za-z]*)$/);
  if (m && m[1]) {
    const unit = m[2] ? m[2].toLowerCase() : (fallbackUnit || "").toLowerCase();
    return { qty: (m[1] + " " + unit).trim(), flagged: false };
  }
  return { qty: raw, flagged: true };
}
function qtyIsZero(raw) {
  const m = (raw || "").match(/(\d+(?:[.,]\d+)?)/);
  if (m) return parseFloat(m[1].replace(",", ".")) === 0;
  return false;
}
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function deptOutletKey(deptKey) {
  const meta = DEPTS.find(d => d.key === deptKey);
  return OUTLET_KEY_MAP_BY_LABEL(meta.outlet);
}
function OUTLET_KEY_MAP_BY_LABEL(label) {
  if (label === "CHERAS") return "CHERAS";
  if (label === "SUNGAI MERAB") return "SUNGAI_MERAB";
  return "CENTRAL_KITCHEN";
}

function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function formatDateLabel(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString("ms-MY", { day: "numeric", month: "long", year: "numeric" });
}

function effectiveItems(deptKey) {
  const overrides = state.itemOverrides[deptKey] || {};
  return (ITEM_DATA[deptKey] || []).map(it => {
    const o = overrides[it.id];
    return o ? Object.assign({}, it, o) : it;
  });
}

function getCollapseMap(key) {
  if (!state.collapse[key]) state.collapse[key] = {};
  return state.collapse[key];
}

function draftKey(key) {
  return `${key}::${state.entryDate}`;
}

function getDraft(key) {
  const dk = draftKey(key);
  if (!state.drafts[dk]) state.drafts[dk] = { pic: "", items: {}, adhoc: [] };
  return state.drafts[dk];
}

async function ensureDraftLoaded(key) {
  const dk = draftKey(key);
  if (state.loadedDraftKeys[dk]) return;
  state.loadedDraftKeys[dk] = true;
  const dateStr = state.entryDate;
  try {
    const docSnap = await db.collection("stocktakes").doc(`${key}_${dateStr}`).get();
    if (!state.savedByDate[dateStr]) state.savedByDate[dateStr] = {};
    if (docSnap && docSnap.exists) {
      const data = docSnap.data();
      state.savedByDate[dateStr][key] = data;
      const draft = getDraft(key);
      draft.pic = data.pic || "";
      draft.adhoc = (data.adhoc || []).map(a => ({ name: a.name, supplier: a.supplier, qty: a.qty }));
      (data.items || []).forEach(it => {
        draft.items[it.name] = { current: it.current || "", orderQty: it.orderQty || "", status: it.status || "" };
      });
    }
  } catch (e) {}
  if (state.view === "dept" && state.deptKey === key) render();
}

function isLowStock(minimum, current) {
  if (!minimum || minimum === "-" || current === "" || current === undefined) return false;
  const minNum = parseFloat(String(minimum).replace(",", "."));
  const curNum = parseFloat(String(current).replace(",", "."));
  if (isNaN(minNum) || isNaN(curNum)) return false;
  return curNum < minNum;
}

function render() {
  const app = document.getElementById("app");
  if (state.view === "home") app.innerHTML = renderHome();
  else if (state.view === "branch") app.innerHTML = renderBranch(state.branchOutlet);
  else if (state.view === "dept") app.innerHTML = renderDept(state.deptKey);
  else if (state.view === "summary") app.innerHTML = renderSummary();
  else if (state.view === "directory") app.innerHTML = renderDirectory();
  else if (state.view === "prices") app.innerHTML = renderPrices();
  else if (state.view === "restock") app.innerHTML = renderRestock();
  attachHandlers();
}

function buildOutletSummary(outletKey, dateStr) {
  const label = OUTLET_LABEL[outletKey];
  const relevantDepts = DEPTS.filter(d => deptOutletKey(d.key) === outletKey);
  const dirMap = state.directory[outletKey] || {};
  const bySupplier = {};
  const ckTransferItems = [];
  const missingDepts = [];
  const dayData = state.savedByDate[dateStr] || {};
  relevantDepts.forEach(d => {
    const saved = dayData[d.key];
    if (!saved) { missingDepts.push(d.dept); return; }
    (saved.items || []).forEach(it => {
      const { qty, flagged } = cleanQty(it.orderQty, it.unit);
      if (!it.orderQty || qtyIsZero(it.orderQty)) return;
      const sup = dirMap[it.id || norm(it.name)] || "Supplier Perlu Confirm";
      if (sup.toUpperCase().includes("CK TRANSFER")) {
        ckTransferItems.push({ name: smartTitle(it.name), qty });
        return;
      }
      if (!bySupplier[sup]) bySupplier[sup] = [];
      bySupplier[sup].push({ name: smartTitle(it.name), qty, flagged });
    });
    (saved.adhoc || []).forEach(a => {
      if (!a.qty || qtyIsZero(a.qty)) return;
      const sup = a.supplier ? a.supplier : "Supplier Perlu Confirm";
      if (sup.toUpperCase().includes("CK TRANSFER")) {
        ckTransferItems.push({ name: smartTitle(a.name), qty: a.qty });
        return;
      }
      if (!bySupplier[sup]) bySupplier[sup] = [];
      bySupplier[sup].push({ name: smartTitle(a.name), qty: a.qty, flagged: false });
    });
  });
  return { label, bySupplier, missingDepts, ckTransferItems };
}

function renderSummary() {
  const dateStr = state.summaryDate;
  const loaded = !!state.savedByDate[dateStr];
  const isToday = dateStr === todayStr();

  if (!loaded) {
    loadDateData(dateStr);
  }

  const blocks = OUTLETS.map(ok => {
    const { label, bySupplier, missingDepts, ckTransferItems } = buildOutletSummary(ok, dateStr);
    const suppliers = Object.keys(bySupplier).sort((a,b) => (a==="Supplier Perlu Confirm")-(b==="Supplier Perlu Confirm") || bySupplier[b].length-bySupplier[a].length);
    const missingHtml = missingDepts.length ? `<div class="status-msg err">⚠️ Belum isi: ${missingDepts.map(escapeHtml).join(", ")}</div>` : "";
    const ckHtml = ckTransferItems.length ? `
      <div class="sup-title">🔄 Transfer dari Central Kitchen (bukan beli)</div>
      ${ckTransferItems.map(e => `<div class="item-line"><span class="bullet">•</span> ${escapeHtml(e.name)} – ${escapeHtml(e.qty)}</div>`).join("")}
    ` : "";
    if (!suppliers.length) {
      if (!missingDepts.length && !ckTransferItems.length) return "";
      return `<div class="outlet-block"><h2>${escapeHtml(label)}</h2>${missingHtml}${ckHtml}</div>`;
    }
    let text = `${label}\n\n`;
    let html = `<h2>${escapeHtml(label)}</h2>${missingHtml}`;
    suppliers.forEach(sup => {
      text += `📍${sup}\n\n`;
      html += `<div class="sup-title">📍${escapeHtml(sup)}</div>`;
      bySupplier[sup].forEach(e => {
        const flag = e.flagged ? " ⚠️" : "";
        text += `* ${e.name} – ${e.qty}${flag}\n`;
        html += `<div class="item-line ${e.flagged ? "flag" : ""}"><span class="bullet">•</span> ${escapeHtml(e.name)} – ${escapeHtml(e.qty)}${flag}</div>`;
      });
      text += "\n";
    });
    const waHref = "https://wa.me/?text=" + encodeURIComponent(text.trim());
    return `<div class="outlet-block" data-text="${escapeHtml(text.trim())}">
      ${html}
      <button class="copy-btn" data-copy-outlet="${escapeHtml(label)}">📋 Copy</button>
      <a class="wa-btn" target="_blank" href="${waHref}">✅ WhatsApp</a>
      ${ckHtml}
    </div>`;
  }).join("");

  const finalBlocks = !loaded
    ? `<div class="empty">Memuatkan...</div>`
    : (blocks || `<div class="empty">Tiada order untuk ${escapeHtml(formatDateLabel(dateStr))}.<br>Isi stock-take dulu kat mana-mana department.</div>`);

  return `
    <header class="top">
      <div class="back-row"><button class="back-btn" data-go="home">← Kembali</button></div>
      <h1>📋 Order Summary</h1>
      <p class="sub">Auto-consolidated ikut outlet &amp; supplier — copy terus ke WhatsApp</p>
      <div class="pic-row">
        <input type="date" id="summary-date-input" value="${dateStr}" max="${todayStr()}">
        <button class="add-adhoc-btn" id="summary-refresh-btn" style="flex:none;">🔄 Refresh</button>
      </div>
      <div class="last-updated">${isToday ? "Hari ini" : escapeHtml(formatDateLabel(dateStr))}</div>
    </header>
    <div class="container">${finalBlocks}</div>
  `;
}

function renderDirectory() {
  const outletKey = state.directoryOutletTab;
  const dirMap = state.directory[outletKey] || {};
  const relevantDepts = DEPTS.filter(d => deptOutletKey(d.key) === outletKey);
  const seen = new Set();
  let rows = [];
  relevantDepts.forEach(d => {
    effectiveItems(d.key).forEach(it => {
      if (seen.has(it.id)) return;
      seen.add(it.id);
      rows.push({ deptKey: d.key, id: it.id, name: it.name, unit: it.unit, minimum: it.minimum });
    });
  });
  const search = state.dirSearch.toLowerCase();
  rows = rows.filter(r => r.name.toLowerCase().includes(search));
  if (state.dirUnresolvedOnly) rows = rows.filter(r => !dirMap[r.id]);
  rows.sort((a,b) => a.name.localeCompare(b.name));

  const unresolvedCount = rows.filter(r => !dirMap[r.id]).length;
  const tabs = OUTLETS.map(ok => `<button class="dir-tab ${ok===outletKey?"active":""}" data-dir-tab="${ok}">${escapeHtml(OUTLET_LABEL[ok])}</button>`).join("");

  const rowsHtml = rows.map(r => {
    const sup = dirMap[r.id] || "";
    return `<div class="item-card">
      <input class="item-name-input" data-master-dept="${r.deptKey}" data-master-id="${escapeHtml(r.id)}" data-master-field="name" value="${escapeHtml(r.name)}">
      <div class="item-inputs">
        <div class="field"><label>Supplier</label>
          <input type="text" placeholder="Perlu Confirm" class="${sup ? "" : "unresolved"}" data-dir-item="${escapeHtml(r.id)}" data-dir-outlet="${outletKey}" value="${escapeHtml(sup)}"></div>
        <div class="field"><label>Unit</label>
          <input type="text" data-master-dept="${r.deptKey}" data-master-id="${escapeHtml(r.id)}" data-master-field="unit" value="${escapeHtml(r.unit)}"></div>
        <div class="field"><label>Minimum</label>
          <input type="text" data-master-dept="${r.deptKey}" data-master-id="${escapeHtml(r.id)}" data-master-field="minimum" value="${escapeHtml(r.minimum)}"></div>
      </div>
    </div>`;
  }).join("");

  const hintKey = outletKey;
  const hint = state.dirSaveHint[hintKey] || state.masterSaveHint[outletKey] || "";

  return `
    <header class="top">
      <div class="back-row"><button class="back-btn" data-go="home">← Kembali</button></div>
      <h1>📇 Item &amp; Supplier</h1>
      <p class="sub">Edit nama, supplier, unit &amp; minimum stock. Auto-save. Supplier kosong = "Perlu Confirm".</p>
      <div class="dir-outlet-tabs">${tabs}</div>
      <div class="search-wrap"><input type="text" class="search" id="dir-search-input" placeholder="Cari item..." value="${escapeHtml(state.dirSearch)}"></div>
      <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:0.8rem;color:var(--ink-soft);">
        <input type="checkbox" id="dir-unresolved-toggle" ${state.dirUnresolvedOnly ? "checked" : ""}>
        Tunjuk "Perlu Confirm" sahaja (${unresolvedCount})
      </label>
    </header>
    <div class="container">
      <div class="dir-save-hint">${escapeHtml(hint)}</div>
      ${unresolvedCount > 0 ? `
      <div class="banner" style="display:flex;flex-direction:column;gap:8px;">
        <strong style="color:var(--ink);">Set semua "Perlu Confirm" yang tunjuk di atas (${unresolvedCount}) ke satu supplier:</strong>
        <div class="add-dir-row">
          <input type="text" id="bulk-dir-supplier" placeholder="Contoh: Ck Transfer Only">
          <button class="add-dir-btn" id="bulk-dir-btn">Set Semua</button>
        </div>
      </div>` : ""}
      ${rows.length ? rowsHtml : '<div class="empty">Tiada item jumpa.</div>'}
      <div class="add-dir-box">
        <div class="supplier-title">Tambah Item Baharu ke Directory</div>
        <div class="add-dir-row">
          <input type="text" id="new-dir-name" placeholder="Nama item">
          <input type="text" id="new-dir-supplier" placeholder="Supplier" style="max-width:120px">
          <button class="add-dir-btn" id="add-dir-btn">+ Simpan</button>
        </div>
        <div class="banner">Item baharu ni akan auto-detect lain kali bila nama sama muncul dalam stock-take atau order.</div>
      </div>
    </div>
  `;
}

function attachHandlers() {
  document.querySelectorAll("[data-go]").forEach(el => {
    el.onclick = () => {
      state.view = el.dataset.go; state.deptKey = el.dataset.key || state.deptKey;
      state.branchOutlet = el.dataset.outlet || state.branchOutlet;
      if (el.dataset.go === "dept") state.entryDate = todayStr();
      if (el.dataset.go === "summary") { state.summaryDate = todayStr(); delete state.savedByDate[state.summaryDate]; }
      state.search = ""; render(); window.scrollTo(0, 0);
    };
  });

  const searchInput = document.getElementById("search-input");
  if (searchInput) {
    searchInput.oninput = (e) => {
      state.search = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const ni = document.getElementById("search-input");
      if (ni) { ni.focus(); ni.setSelectionRange(pos, pos); }
    };
  }

  const picInput = document.getElementById("pic-input");
  if (picInput) picInput.oninput = (e) => { getDraft(state.deptKey).pic = e.target.value; };

  const entryDateInput = document.getElementById("entry-date-input");
  if (entryDateInput) {
    entryDateInput.onchange = (e) => {
      state.entryDate = e.target.value;
      render();
    };
  }

  const summaryDateInput = document.getElementById("summary-date-input");
  if (summaryDateInput) {
    summaryDateInput.onchange = (e) => {
      state.summaryDate = e.target.value;
      delete state.savedByDate[state.summaryDate];
      render();
    };
  }
  const summaryRefreshBtn = document.getElementById("summary-refresh-btn");
  if (summaryRefreshBtn) {
    summaryRefreshBtn.onclick = () => {
      summaryRefreshBtn.textContent = "🔄 Memuat...";
      loadDateData(state.summaryDate);
    };
  }

  const priceSearchInput = document.getElementById("price-search-input");
  if (priceSearchInput) {
    priceSearchInput.oninput = (e) => {
      state.priceSearch = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const ni = document.getElementById("price-search-input");
      if (ni) { ni.focus(); ni.setSelectionRange(pos, pos); }
    };
  }
  const importTextarea = document.getElementById("import-textarea");
  if (importTextarea) importTextarea.oninput = (e) => { state.importText = e.target.value; };
  const importBtn = document.getElementById("import-btn");
  if (importBtn) importBtn.onclick = () => handleImport();
  const receiptPhotoInput = document.getElementById("receipt-photo-input");
  if (receiptPhotoInput) receiptPhotoInput.onchange = (e) => handleReceiptPhoto(e.target.files[0]);

  document.querySelectorAll("[data-restock-days]").forEach(el => {
    el.onclick = () => {
      state.restockDays = parseInt(el.dataset.restockDays, 10);
      state.restockData = null;
      render();
    };
  });

  document.querySelectorAll("[data-toggle-cat]").forEach(el => {
    el.onclick = () => {
      const cm = getCollapseMap(state.deptKey);
      const cat = el.dataset.toggleCat;
      cm[cat] = !cm[cat];
      render();
    };
  });

  document.querySelectorAll("[data-item]").forEach(el => {
    el.oninput = (e) => {
      const draft = getDraft(state.deptKey);
      const key = el.dataset.item, field = el.dataset.field;
      if (!draft.items[key]) draft.items[key] = {};
      draft.items[key][field] = e.target.value;
      const card = el.closest(".item-card");
      if (field === "current") {
        const items = effectiveItems(state.deptKey);
        const itemDef = items.find(i => i.name === key);
        card.classList.toggle("low", itemDef ? isLowStock(itemDef.minimum, e.target.value) : false);
      }
      const cur = draft.items[key].current, oq = draft.items[key].orderQty;
      card.classList.toggle("filled", !!(cur || oq));
    };
  });

  const addAdhocBtn = document.getElementById("add-adhoc-btn");
  if (addAdhocBtn) addAdhocBtn.onclick = () => { getDraft(state.deptKey).adhoc.push({ name:"", supplier:"", qty:"" }); render(); };

  document.querySelectorAll("[data-del-adhoc]").forEach(el => {
    el.onclick = () => { getDraft(state.deptKey).adhoc.splice(parseInt(el.dataset.delAdhoc,10),1); render(); };
  });
  document.querySelectorAll("[data-adhoc]").forEach(el => {
    el.oninput = (e) => { getDraft(state.deptKey).adhoc[parseInt(el.dataset.adhoc,10)][el.dataset.afield] = e.target.value; };
  });

  const saveBtn = document.getElementById("save-btn");
  if (saveBtn) saveBtn.onclick = () => saveDept(state.deptKey);

  document.querySelectorAll("[data-copy-outlet]").forEach(el => {
    el.onclick = () => {
      const block = el.closest(".outlet-block");
      const text = block.dataset.text;
      navigator.clipboard.writeText(text).then(() => {
        el.textContent = "✅ Copied!"; setTimeout(() => { el.textContent = "📋 Copy"; }, 1500);
      }).catch(() => {});
    };
  });

  // Directory view
  document.querySelectorAll("[data-dir-tab]").forEach(el => {
    el.onclick = () => { state.directoryOutletTab = el.dataset.dirTab; state.dirSearch = ""; render(); };
  });
  const dirSearchInput = document.getElementById("dir-search-input");
  if (dirSearchInput) {
    dirSearchInput.oninput = (e) => {
      state.dirSearch = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const ni = document.getElementById("dir-search-input");
      if (ni) { ni.focus(); ni.setSelectionRange(pos, pos); }
    };
  }
  document.querySelectorAll("[data-dir-item]").forEach(el => {
    let debounceTimer;
    el.onchange = () => saveDirectoryEntry(el.dataset.dirOutlet, el.dataset.dirItem, el.value.trim());
  });
  document.querySelectorAll("[data-master-field]").forEach(el => {
    el.onchange = () => saveItemMaster(el.dataset.masterDept, el.dataset.masterId, el.dataset.masterField, el.value.trim());
  });
  const unresolvedToggle = document.getElementById("dir-unresolved-toggle");
  if (unresolvedToggle) {
    unresolvedToggle.onchange = (e) => { state.dirUnresolvedOnly = e.target.checked; render(); };
  }
  const bulkBtn = document.getElementById("bulk-dir-btn");
  if (bulkBtn) {
    bulkBtn.onclick = () => {
      const supEl = document.getElementById("bulk-dir-supplier");
      const sup = supEl.value.trim();
      if (!sup) return;
      const normNames = Array.from(document.querySelectorAll(".item-card input.unresolved[data-dir-item]"))
        .map(el => el.dataset.dirItem);
      if (!normNames.length) return;
      saveDirectoryBulk(state.directoryOutletTab, normNames, sup);
      supEl.value = "";
    };
  }
  const addDirBtn = document.getElementById("add-dir-btn");
  if (addDirBtn) {
    addDirBtn.onclick = () => {
      const nameEl = document.getElementById("new-dir-name");
      const supEl = document.getElementById("new-dir-supplier");
      const name = nameEl.value.trim(), sup = supEl.value.trim();
      if (!name || !sup) return;
      saveDirectoryEntry(state.directoryOutletTab, norm(name), sup);
      nameEl.value = ""; supEl.value = "";
      // also inject into visible rows immediately
      state.directory[state.directoryOutletTab][norm(name)] = sup;
      render();
    };
  }
}

async function saveDept(key) {
  const btn = document.getElementById("save-btn");
  btn.disabled = true; btn.textContent = "Menyimpan...";
  const draft = getDraft(key);
  const meta = DEPTS.find(d => d.key === key);
  const itemsList = effectiveItems(key)
    .map(it => {
      const v = draft.items[it.name] || {};
      return { id: it.id, name: it.name, unit: it.unit, minimum: it.minimum,
               current: v.current || "", orderQty: v.orderQty || "", status: v.status || "" };
    })
    .filter(it => it.current !== "" || it.orderQty !== "" || it.status !== "");
  const adhocList = draft.adhoc.filter(a => a.name);
  const doc = { department: meta.dept, outlet: meta.outlet, pic: draft.pic,
                items: itemsList, adhoc: adhocList, dateStr: state.entryDate, submittedAt: new Date().toISOString() };
  try {
    await db.collection("stocktakes").doc(`${key}_${state.entryDate}`).set(doc);
    if (!state.savedByDate[state.entryDate]) state.savedByDate[state.entryDate] = {};
    state.savedByDate[state.entryDate][key] = doc;
    state.saveMsg[key] = { type: "ok", text: `✅ Tersimpan untuk ${formatDateLabel(state.entryDate)}!` };
  } catch (err) {
    state.saveMsg[key] = { type: "err", text: "⚠️ Gagal simpan — check sambungan internet." };
  }
  render(); window.scrollTo(0, document.body.scrollHeight);
}

async function loadDateData(dateStr) {
  const dayData = {};
  for (const d of DEPTS) {
    try {
      const doc = await db.collection("stocktakes").doc(`${d.key}_${dateStr}`).get();
      if (doc && doc.exists) dayData[d.key] = doc.data();
    } catch (e) {}
  }
  state.savedByDate[dateStr] = dayData;
  render();
}

async function loadDirectory() {
  try {
    const ref = db.collection("directory").doc("map");
    const doc = await ref.get();
    if (doc && doc.exists) {
      const data = doc.data();
      OUTLETS.forEach(ok => { state.directory[ok] = Object.assign({}, DIRECTORY_SEED[ok] || {}, data[ok] || {}); });
    } else {
      await ref.set(DIRECTORY_SEED);
    }
  } catch (e) {}
  state.directoryReady = true;
  render();
}

async function saveDirectoryBulk(outletKey, normNames, supplier) {
  normNames.forEach(n => { state.directory[outletKey][n] = supplier; });
  state.dirSaveHint[outletKey] = `Menyimpan ${normNames.length} item...`;
  render();
  try {
    const ref = db.collection("directory").doc("map");
    const patch = {};
    patch[outletKey] = {};
    normNames.forEach(n => { patch[outletKey][n] = supplier; });
    try {
      await ref.update(patch);
    } catch (e) {
      await ref.set(state.directory);
    }
    state.dirSaveHint[outletKey] = `✅ ${normNames.length} item disimpan`;
  } catch (e) {
    state.dirSaveHint[outletKey] = "⚠️ Gagal simpan";
  }
  render();
  setTimeout(() => {
    state.dirSaveHint[outletKey] = "";
    render();
  }, 2200);
}

async function saveDirectoryEntry(outletKey, normName, supplier) {
  state.directory[outletKey][normName] = supplier;
  state.dirSaveHint[outletKey] = "Menyimpan...";
  const hintEl = document.querySelector(".dir-save-hint");
  if (hintEl) hintEl.textContent = "Menyimpan...";
  try {
    const ref = db.collection("directory").doc("map");
    const patch = {};
    patch[outletKey] = {};
    patch[outletKey][normName] = supplier;
    try {
      await ref.update(patch);
    } catch (e) {
      await ref.set(state.directory); // fallback if doc didn't exist yet
    }
    state.dirSaveHint[outletKey] = "✅ Disimpan";
  } catch (e) {
    state.dirSaveHint[outletKey] = "⚠️ Gagal simpan";
  }
  const hintEl2 = document.querySelector(".dir-save-hint");
  if (hintEl2) hintEl2.textContent = state.dirSaveHint[outletKey];
  setTimeout(() => {
    state.dirSaveHint[outletKey] = "";
    const h = document.querySelector(".dir-save-hint");
    if (h) h.textContent = "";
  }, 1800);
}

function renderPrices() {
  const search = state.priceSearch.toLowerCase();
  const byItem = {}; // normName -> { display, history: [{date, qty, price, total}] }
  state.purchases.forEach(batch => {
    (batch.items || []).forEach(it => {
      const n = norm(it.name);
      if (!n) return;
      if (!byItem[n]) byItem[n] = { display: smartTitle(it.name), history: [] };
      byItem[n].history.push({ date: batch.dateStr, qty: it.qty, price: it.price, total: it.total });
    });
  });
  Object.values(byItem).forEach(v => v.history.sort((a,b) => a.date < b.date ? 1 : -1));

  let rows = Object.entries(byItem).map(([n, v]) => ({ norm: n, ...v }));
  rows = rows.filter(r => r.display.toLowerCase().includes(search));
  rows.sort((a,b) => a.display.localeCompare(b.display));

  const rowsHtml = rows.map(r => {
    const latest = r.history[0];
    const prev = r.history[1];
    let trend = "";
    if (prev && latest.price !== prev.price) {
      const diff = latest.price - prev.price;
      trend = diff > 0 ? ` <span style="color:var(--low);">▲ ${Math.abs(diff).toFixed(2)}</span>` : ` <span style="color:var(--ok);">▼ ${Math.abs(diff).toFixed(2)}</span>`;
    }
    const historyLines = r.history.slice(0, 6).map(h => `<div class="item-meta">${escapeHtml(h.date)} — RM${Number(h.price).toFixed(2)} × ${escapeHtml(String(h.qty))}</div>`).join("");
    return `<div class="item-card">
      <div class="item-name">${escapeHtml(r.display)}</div>
      <div style="font-size:1.1rem;font-weight:800;margin-top:4px;">RM${Number(latest.price).toFixed(2)}${trend}</div>
      <div class="item-meta" style="margin-top:2px;">Terkini: ${escapeHtml(latest.date)} · ${r.history.length} rekod</div>
      <div style="margin-top:8px;">${historyLines}</div>
    </div>`;
  }).join("");

  // daily cost summary
  const byDate = {};
  state.purchases.forEach(batch => {
    const sum = (batch.items || []).reduce((s, it) => s + (Number(it.total) || 0), 0);
    byDate[batch.dateStr] = (byDate[batch.dateStr] || 0) + sum;
  });
  const dateEntries = Object.entries(byDate).sort((a,b) => a[0] < b[0] ? 1 : -1).slice(0, 14);
  const dailyHtml = dateEntries.map(([d, total]) => `<div class="item-line"><span class="bullet">•</span> ${escapeHtml(d)} — <strong>RM${total.toFixed(2)}</strong></div>`).join("");

  return `
    <header class="top">
      <div class="back-row"><button class="back-btn" data-go="home">← Kembali</button></div>
      <h1>💰 Harga &amp; Kos</h1>
      <p class="sub">Import resit pembelian untuk track harga &amp; kos harian.</p>
    </header>
    <div class="container">
      <div class="outlet-block">
        <h2>📥 Import Pembelian</h2>
        <label for="receipt-photo-input" class="save-btn" style="display:block;text-align:center;margin-bottom:10px;background:linear-gradient(135deg, var(--accent-2), var(--accent));">
          📷 Upload Resit (Claude baca automatik)
        </label>
        <input type="file" id="receipt-photo-input" accept="image/*" style="display:none;">
        <div id="receipt-scan-status" class="status-msg"></div>
        <p class="sub" style="margin:12px 0 8px;">Atau taip/tampal manual — satu baris satu item, format: <strong>Nama | Qty | Harga</strong></p>
        <textarea id="import-textarea" rows="6" style="width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--font);font-size:0.82rem;">${escapeHtml(state.importText)}</textarea>
        <div class="pic-row">
          <input type="date" id="import-date-input" value="${state.entryDate}">
        </div>
        <button class="save-btn" id="import-btn" style="margin-top:10px;">📥 Import</button>
        ${state.importMsg ? `<div class="status-msg ${state.importMsg.startsWith("✅") ? "ok" : "err"}">${escapeHtml(state.importMsg)}</div>` : ""}
      </div>

      ${dateEntries.length ? `<div class="outlet-block"><h2>📊 Kos Harian</h2>${dailyHtml}</div>` : ""}

      <div class="search-wrap"><input type="text" class="search" id="price-search-input" placeholder="Cari item..." value="${escapeHtml(state.priceSearch)}"></div>
      ${rows.length ? rowsHtml : '<div class="empty">Tiada rekod harga lagi. Import resit dulu.</div>'}
    </div>
  `;
}

function renderRestock() {
  const data = state.restockData;
  const days = state.restockDays;

  if (!data && state.restockReady) {
    // ready flag set but no data means never computed for current days window
  }
  if (!state.restockLoading && !data) {
    computeRestockData(days);
  }

  let rowsHtml = "";
  if (data) {
    let rows = Object.entries(data).map(([name, v]) => ({ name, ...v })).filter(r => r.count > 0);
    rows.sort((a,b) => b.count - a.count);
    rowsHtml = rows.map(r => {
      const daysSince = r.lastDate ? Math.round((new Date() - new Date(r.lastDate)) / 86400000) : null;
      const curDaysSince = r.curDate ? Math.round((new Date() - new Date(r.curDate)) / 86400000) : null;
      const low = r.curValue ? isLowStock(r.minimum, r.curValue) : false;
      const curHtml = r.curValue
        ? `<div class="item-meta ${low ? "" : ""}" style="${low ? "color:var(--low);font-weight:700;" : ""}">Current stock: ${escapeHtml(r.curValue)}${low ? " ⚠️ bawah minimum" : ""} (dicatat ${curDaysSince} hari lepas)</div>`
        : `<div class="item-meta">Current stock: tiada rekod</div>`;
      return `<div class="item-card">
        <div class="item-name">${escapeHtml(smartTitle(r.name))}</div>
        <div class="item-meta">Order ${r.count}× dalam ${days} hari · purata ${r.avgQty.toFixed(1)} setiap kali</div>
        <div class="item-meta">Kali terakhir order: ${escapeHtml(r.lastDate || "-")}${daysSince !== null ? ` (${daysSince} hari lepas)` : ""}</div>
        ${curHtml}
        <div style="margin-top:6px;font-size:0.82rem;color:var(--accent);font-weight:700;">Cadangan minimum: ${r.avgQty.toFixed(1)} ${escapeHtml(r.unit || "")}</div>
      </div>`;
    }).join("");
    if (!rows.length) rowsHtml = `<div class="empty">Tiada data order dalam ${days} hari terakhir.</div>`;
  } else {
    rowsHtml = `<div class="empty">Mengira...</div>`;
  }

  return `
    <header class="top">
      <div class="back-row"><button class="back-btn" data-go="home">← Kembali</button></div>
      <h1>📈 Restocking Insights</h1>
      <p class="sub">Ikut kekerapan &amp; kuantiti order sebenar — makin banyak hari data, makin tepat.</p>
      <div class="dir-outlet-tabs">
        <button class="dir-tab ${days===7?"active":""}" data-restock-days="7">7 hari</button>
        <button class="dir-tab ${days===30?"active":""}" data-restock-days="30">30 hari</button>
        <button class="dir-tab ${days===90?"active":""}" data-restock-days="90">90 hari</button>
      </div>
    </header>
    <div class="container">${rowsHtml}</div>
  `;
}

async function computeRestockData(days) {
  state.restockLoading = true;
  const agg = {}; // norm(name) -> {name, unit, minimum, count, totalQty, lastDate, lastQty, curDate, curValue}
  const today = new Date();
  const targets = [];
  for (let i = 0; i < days; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    for (const dept of DEPTS) targets.push({ dept, dateStr });
  }
  // fire all reads in parallel instead of one-by-one — far faster, especially on weak connections
  const snaps = await Promise.all(targets.map(t =>
    db.collection("stocktakes").doc(`${t.dept.key}_${t.dateStr}`).get()
      .then(doc => ({ dateStr: t.dateStr, doc }))
      .catch(() => null)
  ));
  for (const snap of snaps) {
    if (!snap || !snap.doc || !snap.doc.exists) continue;
    const dateStr = snap.dateStr;
    const data = snap.doc.data();
    (data.items || []).forEach(it => {
      const n = it.name.toUpperCase();
      if (!agg[n]) agg[n] = { name: it.name, unit: it.unit, minimum: it.minimum, count: 0, totalQty: 0, lastDate: null, lastQty: null, curDate: null, curValue: null };
      // track latest current-stock reading, independent of whether an order was placed that day
      if (it.current && (!agg[n].curDate || dateStr > agg[n].curDate)) {
        agg[n].curDate = dateStr;
        agg[n].curValue = it.current;
      }
      const { qty, flagged } = cleanQty(it.orderQty);
      if (!it.orderQty || flagged) return;
      const num = parseFloat(qty);
      if (isNaN(num)) return;
      agg[n].count += 1;
      agg[n].totalQty += num;
      if (!agg[n].lastDate || dateStr > agg[n].lastDate) { agg[n].lastDate = dateStr; agg[n].lastQty = num; }
    });
  }
  const result = {};
  Object.entries(agg).forEach(([n, v]) => {
    result[v.name] = { count: v.count, avgQty: v.count ? v.totalQty / v.count : 0, lastDate: v.lastDate, lastQty: v.lastQty, unit: v.unit, minimum: v.minimum, curDate: v.curDate, curValue: v.curValue };
  });
  state.restockData = result;
  state.restockLoading = false;
  if (state.view === "restock") render();
}

async function loadPurchases() {
  try {
    const snap = await db.collection("purchases").get();
    state.purchases = [];
    snap.forEach(doc => state.purchases.push(Object.assign({ id: doc.id }, doc.data())));
  } catch (e) {}
  state.purchasesReady = true;
  if (state.view === "prices") render();
}

async function handleReceiptPhoto(file) {
  if (!file) return;
  const statusEl = document.getElementById("receipt-scan-status");
  if (statusEl) { statusEl.className = "status-msg"; statusEl.textContent = "📷 Membaca resit..."; }
  try {
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const res = await fetch("/.netlify/functions/read-receipt", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: base64, mediaType: file.type || "image/jpeg" })
    });
    const data = await res.json();
    if (!res.ok) throw new Error((data && data.error) || "Server error");
    const items = Array.isArray(data) ? data : [];
    if (!items.length) {
      if (statusEl) { statusEl.className = "status-msg err"; statusEl.textContent = "⚠️ Tiada item dikesan. Cuba gambar lebih jelas."; }
      return;
    }
    const lines = items.filter(it => it && it.name && it.qty && it.price).map(it => `${it.name} | ${it.qty} | ${it.price}`);
    state.importText = (state.importText ? state.importText + "\n" : "") + lines.join("\n");
    if (statusEl) { statusEl.className = "status-msg ok"; statusEl.textContent = `✅ ${lines.length} item dikesan — semak bawah sebelum Import.`; }
    render();
  } catch (e) {
    if (statusEl) { statusEl.className = "status-msg err"; statusEl.textContent = "⚠️ Gagal baca resit — check sambungan internet."; }
  }
}

async function handleImport() {
  const text = document.getElementById("import-textarea").value;
  const dateStr = document.getElementById("import-date-input").value || state.entryDate;
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const items = [];
  for (const line of lines) {
    const parts = line.split("|").map(p => p.trim());
    if (parts.length < 3) continue;
    const name = parts[0];
    const qty = parseFloat(parts[1].replace(",", "."));
    const price = parseFloat(parts[2].replace(",", "."));
    if (!name || isNaN(qty) || isNaN(price)) continue;
    items.push({ name, qty, price, total: Math.round(qty * price * 100) / 100 });
  }
  if (!items.length) {
    state.importMsg = "⚠️ Tiada baris sah dijumpai. Semak format: Nama | Qty | Harga";
    render();
    return;
  }
  const btn = document.getElementById("import-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Mengimport..."; }
  try {
    const doc = { dateStr, items, importedAt: new Date().toISOString() };
    const ref = await db.collection("purchases").add(doc);
    state.purchases.push(Object.assign({ id: ref.id }, doc));
    state.importText = "";
    state.importMsg = `✅ ${items.length} item diimport untuk ${dateStr}`;
  } catch (e) {
    state.importMsg = "⚠️ Gagal import — check sambungan internet.";
  }
  render();
}

async function loadItemOverrides() {
  for (const d of DEPTS) {
    try {
      const doc = await db.collection("items").doc(d.key).get();
      if (doc && doc.exists) state.itemOverrides[d.key] = doc.data();
    } catch (e) {}
  }
  state.itemOverridesReady = true;
  render();
}

async function saveItemMaster(deptKey, id, field, value) {
  if (!state.itemOverrides[deptKey]) state.itemOverrides[deptKey] = {};
  if (!state.itemOverrides[deptKey][id]) state.itemOverrides[deptKey][id] = {};
  state.itemOverrides[deptKey][id][field] = value;
  state.masterSaveHint[state.directoryOutletTab] = "Menyimpan...";
  render();
  try {
    const ref = db.collection("items").doc(deptKey);
    const patch = {};
    patch[id] = {};
    patch[id][field] = value;
    try {
      await ref.update(patch);
    } catch (e) {
      await ref.set(state.itemOverrides[deptKey]);
    }
    state.masterSaveHint[state.directoryOutletTab] = "✅ Disimpan";
  } catch (e) {
    state.masterSaveHint[state.directoryOutletTab] = "⚠️ Gagal simpan";
  }
  render();
  setTimeout(() => {
    state.masterSaveHint[state.directoryOutletTab] = "";
    render();
  }, 1800);
}

render();
loadDateData(todayStr());
loadDirectory();
loadItemOverrides();
loadPurchases();
</script>
